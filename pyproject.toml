[project]
name = "bam-financial-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "calibob", email = "yassinezairi242@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "azure-storage-blob>=12.19",
    "datasets>=5.1.0",
    "dbt-core>=1.8",
    "dbt-sqlserver>=1.8",
    "pandas==3.1.0",
    "pdfplumber>=0.11.10",
    "pyarrow>=15.0",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
bam-financial-analytics = "bam_financial_analytics:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
